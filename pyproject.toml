[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bubbles-networks"
version = "0.0.0"
description = "Dynamic bubble-overlap networks, FRM networks, and TGNN forecasting (research code)."
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
